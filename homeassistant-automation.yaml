# Create a Home Assistant automation in YAML mode and check entity IDs.
alias: Smart Cat Flap - Opening notification
description: Notify the configured phone; flap direction does not confirm a completed passage.
triggers:
  - trigger: state
    entity_id: event.smart_cat_flap_opening
    id: real
  - trigger: state
    entity_id: event.smart_cat_flap_test_opening
    id: test
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state
         and trigger.to_state.attributes.get('event_type') in ['inside', 'outside', 'unclear'] }}
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "{{ 'TEST - ' if trigger.id == 'test' else '' }}Smart Cat Flap"
      message: >-
        {% set direction = trigger.to_state.attributes.get('event_type') %}
        {% if direction == 'unclear' %}
          The cat flap moved. Direction unclear.
        {% else %}
          The cat flap opened {{ 'inward' if direction == 'inside' else 'outward' }}.
        {% endif %}
      data:
        tag: "cat_flap_{{ trigger.id }}"
mode: queued
max: 10
