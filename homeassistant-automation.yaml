# Create a Home Assistant automation in YAML mode and check entity IDs.
alias: Smart Cat Flap - Opening notification
description: Notify the configured phone; flap direction does not confirm a completed passage.
# Choose notification language separately from the dashboard profile language.
# Supported values: en, de. Unknown values use English.
variables:
  notification_language: en
triggers:
  - trigger: state
    entity_id: event.smart_cat_flap_opening
    id: real
  - trigger: state
    entity_id: event.smart_cat_flap_test_opening
    id: test
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state
         and trigger.to_state.attributes.get('event_type') in ['inside', 'outside', 'unclear'] }}
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "{{ 'TEST - ' if trigger.id == 'test' else '' }}{{ 'Katzenklappe' if notification_language == 'de' else 'Smart Cat Flap' }}"
      message: >-
        {% set direction = trigger.to_state.attributes.get('event_type') %}
        {% if notification_language == 'de' %}
          {% if direction == 'unclear' %}
            Die Katzenklappe wurde bewegt. Richtung unklar.
          {% else %}
            Die Katzenklappe wurde nach {{ 'innen' if direction == 'inside' else 'außen' }} geöffnet.
          {% endif %}
        {% else %}
          {% if direction == 'unclear' %}
            The cat flap moved. Direction unclear.
          {% else %}
            The cat flap opened {{ 'inward' if direction == 'inside' else 'outward' }}.
          {% endif %}
        {% endif %}
      data:
        tag: "cat_flap_{{ trigger.id }}"
mode: queued
max: 10
