# Create a Home Assistant automation in YAML mode and check entity IDs.
alias: Smart Cat Flap - Battery notification
description: Notify the configured phone; real measurements and simulations are separate.
triggers:
  - trigger: state
    entity_id: event.smart_cat_flap_battery_warning
    id: real
  - trigger: state
    entity_id: event.smart_cat_flap_battery_test_event
    id: test
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state
         and trigger.to_state.attributes.get('event_type') in ['low', 'recovered'] }}
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: "{{ 'TEST - ' if trigger.id == 'test' else '' }}Smart Cat Flap Battery"
      message: >-
        {{ 'The battery is low. Please recharge.'
           if trigger.to_state.attributes.get('event_type') == 'low'
           else 'The battery voltage has recovered above the warning threshold.' }}
      data:
        tag: "cat_flap_battery_{{ trigger.id }}"
mode: queued
max: 10
