esphome:
  on_boot:
    priority: -90
    then:
      - lambda: id(pm_history_boot)++;

# Optional INA3221 package. Physical module wiring must be verified before installation.
# Safe to preload without the module: battery measurements remain unknown.
# Reboot after connecting the module; ESPHome initializes I2C sensors at startup.
# Include via packages; do not merge this sensor list manually.
substitutions:
  pm_battery_script: process_battery
  pm_voltage_id: real_battery_voltage
  pm_warning_id: real_battery_warning
  pm_sda_pin: GPIO22 # Default: XIAO D4; override to match your wiring.
  pm_scl_pin: GPIO23 # Default: XIAO D5; override to match your wiring.

packages:
  usb_detection: !include usb-detection.yaml

i2c:
  id: pm_i2c
  sda: ${pm_sda_pin}
  scl: ${pm_scl_pin}
  scan: true
  frequency: 100kHz

globals:
  - id: pm_history_boot
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: pm_history_discharge_mah
    type: double
    restore_value: true
    initial_value: '0.0'
  - id: pm_history_charge_mah
    type: double
    restore_value: true
    initial_value: '0.0'
  - id: pm_history_battery_seconds
    type: double
    restore_value: true
    initial_value: '0.0'
  - id: pm_history_usb_seconds
    type: double
    restore_value: true
    initial_value: '0.0'
  - id: pm_history_gap_count
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: pm_history_last_usb
    type: bool
    initial_value: 'false'
  - id: pm_history_usb_seen
    type: bool
    initial_value: 'false'
  - id: pm_sample_seen
    type: bool
    initial_value: 'false'
  - id: pm_last_sample
    type: uint32_t
    initial_value: '0'
  - id: pm_calibrated
    type: bool
    restore_value: true
    initial_value: 'false'
  # Every boot starts conservatively: charge during downtime was not measured.
  - id: pm_estimate_uncertain
    type: bool
    initial_value: 'true'
  - id: pm_remaining_ah
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: pm_average_discharge
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: pm_calibrated_capacity
    type: float
    restore_value: true
    initial_value: '2000.0'
  - id: pm_discharge_samples
    type: uint32_t
    restore_value: true
    initial_value: '0'

text_sensor:
  - platform: template
    id: pm_history_report
    name: Battery history report
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (!id(pm_sample_seen)) return {"unknown"};
      return str_sprintf("{\"v\":1,\"b\":%u,\"d\":%.4f,\"c\":%.4f,\"s\":%.3f,\"u\":%.3f,\"g\":%u,\"t\":%.3f}",
        unsigned(id(pm_history_boot)), id(pm_history_discharge_mah), id(pm_history_charge_mah),
        id(pm_history_battery_seconds), id(pm_history_usb_seconds), unsigned(id(pm_history_gap_count)),
        esphome::millis_64() / 1000.0);
  - platform: template
    id: pm_estimate_quality
    name: Battery estimate quality
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (!id(pm_calibrated)) return {"uncalibrated"};
      if (!id(pm_sample_seen) ||
          static_cast<uint32_t>(static_cast<uint32_t>(esphome::millis_64()) - id(pm_last_sample)) > 20000)
        return {"measurement_unavailable"};
      return {id(pm_estimate_uncertain) ? "uncertain" : "calibrated"};

  - platform: template
    id: pm_charging_status
    name: Charging status
    update_interval: never

number:
  - platform: template
    id: pm_usable_capacity
    name: Usable battery capacity
    entity_category: config
    unit_of_measurement: mAh
    min_value: 100
    max_value: 5000
    step: 50
    initial_value: 2000
    restore_value: true
    optimistic: true
    mode: box
    on_value:
      - lambda: |-
          // Restoring the same capacity at boot must preserve calibration.
          if (std::fabs(x - id(pm_calibrated_capacity)) > 0.1f) id(pm_calibrated) = false;
          id(pm_calibrated_capacity) = x;

sensor:
  - platform: ina3221
    id: pm_ina3221
    i2c_id: pm_i2c
    address: 0x40
    update_interval: 5s
    channel_1:
      shunt_resistance: 0.1 ohm # R100 on the selected module; verify before connecting.
      bus_voltage:
        id: pm_bus_voltage
        internal: true
      shunt_voltage:
        id: pm_shunt_voltage
        internal: true
      current:
        id: pm_battery_current
        name: Battery current
        accuracy_decimals: 3
        on_value:
          - lambda: |-
              // VIN+ is on the battery side: positive discharges, negative charges.
              const float voltage = id(pm_bus_voltage).state + id(pm_shunt_voltage).state;
              if (!std::isfinite(x) || std::fabs(x) > 1.0f ||
                  !std::isfinite(voltage) || voltage < 2.5f || voltage > 4.3f) {
                id(pm_invalidate).execute();
                return;
              }
              const uint32_t now = static_cast<uint32_t>(esphome::millis_64());
              const uint32_t elapsed = now - id(pm_last_sample);
              // Persistent cumulative counters bridge radio pauses without sampling bias in HA.
              // Unmeasured gaps and USB transitions are excluded, never treated as zero load.
              if (id(pm_sample_seen) && elapsed > 20000) id(pm_history_gap_count)++;
              const bool usb_known = id(pm_usb_present).has_state();
              const bool usb_now = usb_known && id(pm_usb_present).state;
              if (id(pm_sample_seen) && elapsed <= 20000 && usb_known &&
                  id(pm_history_usb_seen) && usb_now == id(pm_history_last_usb)) {
                const double seconds = elapsed / 1000.0;
                if (usb_now) id(pm_history_usb_seconds) += seconds;
                else {
                  id(pm_history_battery_seconds) += seconds;
                  id(pm_history_discharge_mah) += std::max(0.0f, x) * seconds / 3.6;
                }
                id(pm_history_charge_mah) += std::max(0.0f, -x) * seconds / 3.6;
              }
              id(pm_history_last_usb) = usb_now;
              id(pm_history_usb_seen) = usb_known;
              if (id(pm_sample_seen) && elapsed > 20000) id(pm_estimate_uncertain) = true;
              if (id(pm_calibrated) && id(pm_sample_seen) && elapsed <= 20000) {
                // Approximate charge integration; brief Wi-Fi current peaks can be missed.
                const float used_ah = x * (elapsed / 3600000.0f);
                id(pm_remaining_ah) = std::max(0.0f, std::min(
                  id(pm_usable_capacity).state / 1000.0f, id(pm_remaining_ah) - used_ah));
              }
              id(pm_last_sample) = now;
              id(pm_sample_seen) = true;
              id(${pm_battery_script}).execute(voltage, false);
              if (!id(pm_usb_present).has_state()) {
                id(pm_charging_status).publish_state("unknown");
              } else if (x < -0.005f && id(pm_usb_present).state) {
                id(pm_charging_status).publish_state("charging");
              } else if (x > 0.005f) {
                id(pm_charging_status).publish_state("discharging");
              } else {
                // Near-zero current is not proof of a full cell or an active charger.
                id(pm_charging_status).publish_state(x < -0.005f ? "unknown" : "not_charging");
              }
              // Include the small sleep current in the average. Filtering it out
              // would reset the estimate between every Wi-Fi reporting window.
              if (id(pm_usb_present).has_state() && !id(pm_usb_present).state && x >= 0.0f) {
                id(pm_average_discharge) = id(pm_discharge_samples) == 0 ? x :
                  0.05f * x + 0.95f * id(pm_average_discharge);
                if (id(pm_discharge_samples) < 100000) id(pm_discharge_samples)++;
              }
  - platform: template
    id: pm_estimated_battery_level
    name: Estimated battery level
    device_class: battery
    state_class: measurement
    unit_of_measurement: '%'
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      const float capacity = id(pm_usable_capacity).state / 1000.0f;
      if (!id(pm_calibrated) || !id(pm_sample_seen) ||
          static_cast<uint32_t>(static_cast<uint32_t>(esphome::millis_64()) - id(pm_last_sample)) > 20000 ||
          !std::isfinite(capacity) || capacity <= 0.0f || !std::isfinite(id(pm_remaining_ah)))
        return NAN;
      return std::max(0.0f, std::min(100.0f, 100.0f * id(pm_remaining_ah) / capacity));
  - platform: template
    id: pm_estimated_runtime
    name: Estimated runtime
    unit_of_measurement: h
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      // Forecast is now learned from 30-day SQLite history in Home Assistant.
      // Do not expose the old short-window current average as remaining runtime.
      return NAN;

button:
  - platform: template
    name: Confirm full battery
    entity_category: config
    on_press:
      - lambda: |-
          // User must first observe charge completion. Voltage alone is not enough.
          if (!id(pm_sample_seen) || static_cast<uint32_t>(static_cast<uint32_t>(esphome::millis_64()) - id(pm_last_sample)) > 20000 ||
              !id(pm_usb_present).has_state() || !id(pm_usb_present).state ||
              !std::isfinite(id(pm_battery_current).state) ||
              std::fabs(id(pm_battery_current).state) > 0.010f ||
              id(${pm_voltage_id}).state < 4.10f || !std::isfinite(id(${pm_voltage_id}).state)) {
            ESP_LOGW("power_monitor", "Full-battery confirmation rejected: readings not suitable");
            return;
          }
          id(pm_remaining_ah) = id(pm_usable_capacity).state / 1000.0f;
          id(pm_calibrated) = true;
          id(pm_estimate_uncertain) = false;
          ESP_LOGI("power_monitor", "Runtime estimate calibrated from user-confirmed full battery");
      - delay: 2s
      - lambda: |-
          if (!global_preferences->sync())
            ESP_LOGW("power_monitor", "Could not flush saved battery reference to flash");

script:
  - id: pm_invalidate
    then:
      - lambda: |-
          // Invalidate live readings, never erase the saved full reference or learned load.
          // The unmeasured interval is skipped; subsequent estimates explicitly warn about it.
          id(pm_sample_seen) = false;
          id(pm_estimate_uncertain) = true;
          id(${pm_voltage_id}).publish_state(NAN);
          // Guard against re-entering this script through the current on_value callback.
          if (std::isfinite(id(pm_battery_current).state)) id(pm_battery_current).publish_state(NAN);
          id(${pm_warning_id}).invalidate_state();
          id(pm_charging_status).publish_state("unknown");
          id(pm_estimated_runtime).publish_state(NAN);
          id(pm_estimated_battery_level).publish_state(NAN);

interval:
  - interval: 5s
    then:
      - lambda: |-
          // Allow the first asynchronous INA measurement to arrive after boot.
          if (static_cast<uint32_t>(static_cast<uint32_t>(esphome::millis_64()) - id(pm_last_sample)) > 20000)
            id(pm_invalidate).execute();
