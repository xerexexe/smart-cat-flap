# Mit den Listen der laufenden Konfiguration zusammenfuehren.
# Kein RFID-Treiber, kein ADC-Anschluss: Hardware liefert spaeter normalisierte Werte.
globals:
  - id: akku_niedrig_echt
    type: bool
    initial_value: 'false'
  - id: akku_niedrig_test
    type: bool
    initial_value: 'false'

text:
  - platform: template
    id: erlaubter_chip
    name: Erlaubte Chipnummer
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ''
    min_length: 0
    max_length: 32
    entity_category: config
  - platform: template
    id: test_chip
    name: Test Chipnummer
    mode: text
    optimistic: true
    initial_value: ''
    min_length: 0
    max_length: 32

number:
  - platform: template
    id: test_akkuspannung
    name: Test Akkuspannung
    optimistic: true
    initial_value: 4.0
    min_value: 2.5
    max_value: 4.3
    step: 0.05
    unit_of_measurement: V
    mode: box

button:
  - platform: template
    name: Test Chip lesen
    on_press:
      - if:
          condition:
            switch.is_on: testmodus
          then:
            - script.execute:
                id: chip_verarbeiten
                chip: !lambda return id(test_chip).state;
                test: true
  - platform: template
    name: Test Akku pruefen
    on_press:
      - if:
          condition:
            switch.is_on: testmodus
          then:
            - script.execute:
                id: akku_verarbeiten
                spannung: !lambda return id(test_akkuspannung).state;
                test: true

text_sensor:
  - platform: template
    id: rfid_status
    name: RFID Zuordnung
    update_interval: never
  - platform: template
    id: rfid_teststatus
    name: RFID Teststatus
    update_interval: never
  - platform: template
    id: akku_teststatus
    name: Akku Teststatus
    update_interval: never

sensor:
  - platform: template
    id: akkuspannung_echt
    name: Akkuspannung
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: akkuspannung_testwert
    name: Akku Testmesswert
    unit_of_measurement: V
    accuracy_decimals: 2
    update_interval: never

binary_sensor:
  - platform: template
    id: akkuwarnung_echt
    name: Akku niedrig
    device_class: battery
  - platform: template
    id: akkuwarnung_test
    name: Akku Testwarnung

event:
  - platform: template
    id: akkuereignis
    name: Akkuwarnung
    event_types: [niedrig, erholt]
  - platform: template
    id: akkutestereignis
    name: Akku Testereignis
    event_types: [niedrig, erholt]

script:
  # Spaeter vom passenden Leser-Treiber aufrufen; keine Fantasie-UART-Protokolle.
  - id: chip_verarbeiten
    parameters:
      chip: string
      test: bool
    then:
      - lambda: |-
          auto normalisieren = [](const std::string &wert) -> std::string {
            std::string result;
            for (const char c : wert) {
              if (c >= '0' && c <= '9') result += c;
              else if (c != ' ' && c != '-') return "";
            }
            return result.size() == 15 ? result : "";
          };
          const std::string nummer = normalisieren(chip);
          const std::string bekannt = normalisieren(id(erlaubter_chip).state);
          const std::string status = nummer.empty() ? "ungueltige Chipnummer" :
            bekannt.empty() ? "keine Katze eingelernt" :
            nummer == bekannt ? "eigene Katze" : "fremder Chip";
          if (test) id(rfid_teststatus).publish_state(status);
          else id(rfid_status).publish_state(status);
          // Chipnummern werden bewusst nicht ins Protokoll geschrieben.
          ESP_LOGI("katzenklappe", "%sRFID: %s", test ? "TEST: " : "", status.c_str());

  # Spaeter mit kalibrierter Zellspannung vom Messadapter aufrufen.
  - id: akku_verarbeiten
    parameters:
      spannung: float
      test: bool
    then:
      - lambda: |-
          if (!std::isfinite(spannung) || spannung < 2.5f || spannung > 4.3f) {
            if (test) id(akku_teststatus).publish_state("ungueltiger Messwert");
            return;
          }
          // Vorlaeufig fuer eine 1S-LiPo-Zelle, keine Prozentanzeige.
          bool &niedrig = test ? id(akku_niedrig_test) : id(akku_niedrig_echt);
          const bool vorher = niedrig;
          if (spannung <= 3.50f) niedrig = true;
          else if (spannung >= 3.65f) niedrig = false;
          if (test) {
            id(akkuspannung_testwert).publish_state(spannung);
            id(akkuwarnung_test).publish_state(niedrig);
            id(akku_teststatus).publish_state(niedrig ? "Akku niedrig" : "Akku ausreichend");
          } else {
            id(akkuspannung_echt).publish_state(spannung);
            id(akkuwarnung_echt).publish_state(niedrig);
          }
          // Nur Zustandswechsel melden, keine Meldung bei jedem Messwert.
          if (vorher != niedrig) {
            const std::string art = niedrig ? "niedrig" : "erholt";
            if (test) id(akkutestereignis).trigger(art);
            else id(akkuereignis).trigger(art);
          }
