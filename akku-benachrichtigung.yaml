alias: Katzenklappe - Akku melden
description: konfiguriertes Handy, reale Messung und Simulation getrennt.
triggers:
  - trigger: state
    entity_id: event.katzenklappe_akkuwarnung
    id: echt
  - trigger: state
    entity_id: event.katzenklappe_akku_testereignis
    id: test
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unknown', 'unavailable']
         and trigger.from_state.state != trigger.to_state.state
         and trigger.to_state.attributes.get('event_type') in ['niedrig', 'erholt'] }}
actions:
  - action: notify.mobile_app_dein_handy
    data:
      title: "{{ 'TEST - ' if trigger.id == 'test' else '' }}Katzenklappe Akku"
      message: >-
        {{ 'Der Akku ist niedrig. Bitte laden.'
           if trigger.to_state.attributes.get('event_type') == 'niedrig'
           else 'Die Akkuspannung liegt wieder oberhalb der Warnschwelle.' }}
      data:
        tag: "katzenklappe_akku_{{ trigger.id }}"
mode: queued
max: 10
