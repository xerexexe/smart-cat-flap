# Save locally as secrets.yaml and replace all placeholders.
# Do not upload secrets.yaml to GitHub.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
# Enter the 32-byte Base64 key generated by ESPHome.
api_encryption_key: "YOUR_ESPHOME_API_KEY"
# Encrypted OTA uses its provisioned encryption key; do not also set a password.
