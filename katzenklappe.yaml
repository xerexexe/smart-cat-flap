# Stufe 2: Zwei Reedkontakte und Testmodus. Stromversorgung zum Testen ueber USB.
esphome:
  name: katzenklappe-smart
  friendly_name: Katzenklappe

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Diesen Block ersetzt man ab binary_sensor: in der bestehenden Konfiguration.
# WLAN, API, OTA und Board-Konfiguration bleiben erhalten.
# USB-Testbetrieb; noch kein Deep Sleep oder Akkumanagement.
globals:
  - id: bereit
    type: bool
    initial_value: 'false'
  - id: ruhe_laeuft
    type: bool
    initial_value: 'false'
  - id: ruhe_seit
    type: uint32_t
    initial_value: '0'
  - id: richtung_offen
    type: int
    initial_value: '0'
  - id: signal_seit
    type: uint32_t
    initial_value: '0'
  - id: anzahl_echt
    type: uint32_t
    initial_value: '0'
  - id: anzahl_test
    type: uint32_t
    initial_value: '0'
  - id: akku_niedrig_echt
    type: bool
    initial_value: 'false'
  - id: akku_niedrig_test
    type: bool
    initial_value: 'false'

binary_sensor:
  - platform: gpio
    id: kontakt_innen
    name: Kontakt innen
    pin:
      number: GPIO0 # D0, Kontakt schliesst gegen GND bei Magnetnaehe
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 50ms
  - platform: gpio
    id: kontakt_aussen
    name: Kontakt aussen
    pin:
      number: GPIO1 # D1, Kontakt schliesst gegen GND bei Magnetnaehe
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 50ms
  - platform: template
    name: Erkennung bereit
    entity_category: diagnostic
    lambda: return id(bereit);
  - platform: status
    name: Verbindung
  - platform: template
    id: akkuwarnung_echt
    name: Akku niedrig
    device_class: battery
  - platform: template
    id: akkuwarnung_test
    name: Akku Testwarnung

switch:
  - platform: template
    id: testmodus
    name: Testmodus
    icon: mdi:test-tube
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: erkennung_reset
    turn_off_action:
      - script.execute: erkennung_reset
  - platform: template
    id: test_innen
    name: Testkontakt innen
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: test_aussen
    name: Testkontakt aussen
    optimistic: true
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: template
    id: letzte_richtung
    name: Letzte Oeffnungsrichtung
    update_interval: never
  - platform: template
    id: letzte_testrichtung
    name: Letzte Testrichtung
    update_interval: never
  - platform: template
    id: rfid_status
    name: RFID Zuordnung
    update_interval: never
  - platform: template
    id: rfid_teststatus
    name: RFID Teststatus
    update_interval: never
  - platform: template
    id: akku_teststatus
    name: Akku Teststatus
    update_interval: never

sensor:
  - platform: template
    id: zaehler_echt
    name: Oeffnungen seit Neustart
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(anzahl_echt);
    update_interval: 1s
  - platform: template
    id: zaehler_test
    name: Testoeffnungen seit Neustart
    accuracy_decimals: 0
    lambda: return id(anzahl_test);
    update_interval: 1s
  - platform: template
    id: akkuspannung_echt
    name: Akkuspannung
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: akkuspannung_testwert
    name: Akku Testmesswert
    unit_of_measurement: V
    accuracy_decimals: 2
    update_interval: never

event:
  - platform: template
    id: oeffnung
    name: Oeffnung
    event_types: [innen, aussen, unklar]
  - platform: template
    id: testoeffnung
    name: Testoeffnung
    event_types: [innen, aussen, unklar]
  - platform: template
    id: akkuereignis
    name: Akkuwarnung
    event_types: [niedrig, erholt]
  - platform: template
    id: akkutestereignis
    name: Akku Testereignis
    event_types: [niedrig, erholt]

script:
  - id: erkennung_reset
    then:
      - switch.turn_off: test_innen
      - switch.turn_off: test_aussen
      - lambda: |-
          id(bereit) = false;
          id(ruhe_laeuft) = false;
          id(richtung_offen) = 0;
  - id: bewegung_melden
    parameters:
      richtung: int
      test: bool
    then:
      - lambda: |-
          const std::string text = richtung == 1 ? "innen" : richtung == 2 ? "aussen" : "unklar";
          if (test) {
            id(anzahl_test)++;
            id(letzte_testrichtung).publish_state(text);
            id(zaehler_test).publish_state(id(anzahl_test));
            id(testoeffnung).trigger(text);
          } else {
            id(anzahl_echt)++;
            id(letzte_richtung).publish_state(text);
            id(zaehler_echt).publish_state(id(anzahl_echt));
            id(oeffnung).trigger(text);
          }
          ESP_LOGI("katzenklappe", "%sOeffnungsrichtung: %s", test ? "TEST: " : "", text.c_str());
  # Spaeter vom passenden Leser-Treiber aufrufen; keine Fantasie-UART-Protokolle.
  - id: chip_verarbeiten
    parameters:
      chip: string
      test: bool
    then:
      - lambda: |-
          auto normalisieren = [](const std::string &wert) -> std::string {
            std::string result;
            for (const char c : wert) {
              if (c >= '0' && c <= '9') result += c;
              else if (c != ' ' && c != '-') return "";
            }
            return result.size() == 15 ? result : "";
          };
          const std::string nummer = normalisieren(chip);
          const std::string bekannt = normalisieren(id(erlaubter_chip).state);
          const std::string status = nummer.empty() ? "ungueltige Chipnummer" :
            bekannt.empty() ? "keine Katze eingelernt" :
            nummer == bekannt ? "eigene Katze" : "fremder Chip";
          if (test) id(rfid_teststatus).publish_state(status);
          else id(rfid_status).publish_state(status);
          // Chipnummern werden bewusst nicht ins Protokoll geschrieben.
          ESP_LOGI("katzenklappe", "%sRFID: %s", test ? "TEST: " : "", status.c_str());

  # Spaeter mit kalibrierter Zellspannung vom Messadapter aufrufen.
  - id: akku_verarbeiten
    parameters:
      spannung: float
      test: bool
    then:
      - lambda: |-
          if (!std::isfinite(spannung) || spannung < 2.5f || spannung > 4.3f) {
            if (test) id(akku_teststatus).publish_state("ungueltiger Messwert");
            return;
          }
          // Vorlaeufig fuer eine 1S-LiPo-Zelle, keine Prozentanzeige.
          bool &niedrig = test ? id(akku_niedrig_test) : id(akku_niedrig_echt);
          const bool vorher = niedrig;
          if (spannung <= 3.50f) niedrig = true;
          else if (spannung >= 3.65f) niedrig = false;
          if (test) {
            id(akkuspannung_testwert).publish_state(spannung);
            id(akkuwarnung_test).publish_state(niedrig);
            id(akku_teststatus).publish_state(niedrig ? "Akku niedrig" : "Akku ausreichend");
          } else {
            id(akkuspannung_echt).publish_state(spannung);
            id(akkuwarnung_echt).publish_state(niedrig);
          }
          // Nur Zustandswechsel melden, keine Meldung bei jedem Messwert.
          if (vorher != niedrig) {
            const std::string art = niedrig ? "niedrig" : "erholt";
            if (test) id(akkutestereignis).trigger(art);
            else id(akkuereignis).trigger(art);
          }

interval:
  - interval: 20ms
    then:
      - lambda: |-
          const bool test = id(testmodus).state;
          // Beim Boot warten wir auf gueltige, entprellte GPIO-Zustaende.
          if (!test && (!id(kontakt_innen).has_state() || !id(kontakt_aussen).has_state())) return;
          const bool innen = test ? id(test_innen).state : id(kontakt_innen).state;
          const bool aussen = test ? id(test_aussen).state : id(kontakt_aussen).state;
          const uint32_t jetzt = millis();

          // Innerhalb 100 ms auftretende beide Signale sind nicht eindeutig.
          if (id(richtung_offen) != 0) {
            if ((id(richtung_offen) == 1 && aussen) || (id(richtung_offen) == 2 && innen))
              id(richtung_offen) = 3;
            if (static_cast<uint32_t>(jetzt - id(signal_seit)) >= 100) {
              id(bewegung_melden).execute(id(richtung_offen), test);
              id(richtung_offen) = 0;
            }
          }

          if (innen || aussen) {
            id(ruhe_laeuft) = false;
            if (id(bereit)) {
              id(bereit) = false;
              id(signal_seit) = jetzt;
              id(richtung_offen) = innen && aussen ? 3 : innen ? 1 : 2;
            }
          } else {
            if (!id(ruhe_laeuft)) {
              id(ruhe_laeuft) = true;
              id(ruhe_seit) = jetzt;
            }
            // Unsigned-Differenz funktioniert auch beim millis()-Ueberlauf.
            if (id(richtung_offen) == 0 && static_cast<uint32_t>(jetzt - id(ruhe_seit)) >= 5000)
              id(bereit) = true;
          }


text:
  - platform: template
    id: erlaubter_chip
    name: Erlaubte Chipnummer
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ''
    min_length: 0
    max_length: 32
    entity_category: config
  - platform: template
    id: test_chip
    name: Test Chipnummer
    mode: text
    optimistic: true
    initial_value: ''
    min_length: 0
    max_length: 32

number:
  - platform: template
    id: test_akkuspannung
    name: Test Akkuspannung
    optimistic: true
    initial_value: 4.0
    min_value: 2.5
    max_value: 4.3
    step: 0.05
    unit_of_measurement: V
    mode: box

button:
  - platform: template
    name: Test Chip lesen
    on_press:
      - if:
          condition:
            switch.is_on: testmodus
          then:
            - script.execute:
                id: chip_verarbeiten
                chip: !lambda return id(test_chip).state;
                test: true
  - platform: template
    name: Test Akku pruefen
    on_press:
      - if:
          condition:
            switch.is_on: testmodus
          then:
            - script.execute:
                id: akku_verarbeiten
                spannung: !lambda return id(test_akkuspannung).state;
                test: true
