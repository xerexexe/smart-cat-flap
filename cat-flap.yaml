# Beta: two reed contacts and test mode. Use USB power during development.
esphome:
  name: smart-cat-flap
  friendly_name: Smart Cat Flap

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Reference fragment: merge component lists into an existing configuration.
# Keep existing Wi-Fi, API, OTA and board settings when migrating.
# USB development mode; no deep sleep or physical battery measurement yet.
globals:
  - id: ready
    type: bool
    initial_value: 'false'
  - id: quiet_timer_running
    type: bool
    initial_value: 'false'
  - id: quiet_since
    type: uint32_t
    initial_value: '0'
  - id: pending_direction
    type: int
    initial_value: '0'
  - id: signal_since
    type: uint32_t
    initial_value: '0'
  - id: real_count
    type: uint32_t
    initial_value: '0'
  - id: test_count
    type: uint32_t
    initial_value: '0'
  - id: real_battery_low
    type: bool
    initial_value: 'false'
  - id: test_battery_low
    type: bool
    initial_value: 'false'

binary_sensor:
  - platform: gpio
    id: inside_contact
    name: Inside contact
    pin:
      number: GPIO0 # D0, contact closes to GND when the magnet approaches
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 50ms
  - platform: gpio
    id: outside_contact
    name: Outside contact
    pin:
      number: GPIO1 # D1, contact closes to GND when the magnet approaches
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 50ms
  - platform: template
    name: Detection ready
    entity_category: diagnostic
    lambda: return id(ready);
  - platform: status
    name: Connection
  - platform: template
    id: real_battery_warning
    name: Battery low
    device_class: battery
  - platform: template
    id: test_battery_warning
    name: Battery test warning

switch:
  - platform: template
    id: test_mode
    name: Test mode
    icon: mdi:test-tube
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: reset_detection
    turn_off_action:
      - script.execute: reset_detection
  - platform: template
    id: test_inside
    name: Test inside contact
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: test_outside
    name: Test outside contact
    optimistic: true
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: template
    id: last_direction
    name: Last opening direction
    update_interval: never
  - platform: template
    id: last_test_direction
    name: Last test direction
    update_interval: never
  - platform: template
    id: rfid_status
    name: RFID match
    update_interval: never
  - platform: template
    id: rfid_test_status
    name: RFID test status
    update_interval: never
  - platform: template
    id: battery_test_status
    name: Battery test status
    update_interval: never

sensor:
  - platform: template
    id: real_counter
    name: Openings since restart
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(real_count);
    update_interval: 1s
  - platform: template
    id: test_counter
    name: Test openings since restart
    accuracy_decimals: 0
    lambda: return id(test_count);
    update_interval: 1s
  - platform: template
    id: real_battery_voltage
    name: Battery voltage
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: test_battery_reading
    name: Battery test reading
    unit_of_measurement: V
    accuracy_decimals: 2
    update_interval: never

event:
  - platform: template
    id: opening
    name: Opening
    event_types: [inside, outside, unclear]
  - platform: template
    id: test_opening
    name: Test opening
    event_types: [inside, outside, unclear]
  - platform: template
    id: battery_event
    name: Battery warning
    event_types: [low, recovered]
  - platform: template
    id: test_battery_event
    name: Battery test event
    event_types: [low, recovered]

script:
  - id: reset_detection
    then:
      - switch.turn_off: test_inside
      - switch.turn_off: test_outside
      - lambda: |-
          id(ready) = false;
          id(quiet_timer_running) = false;
          id(pending_direction) = 0;
  - id: report_movement
    parameters:
      direction: int
      test: bool
    then:
      - lambda: |-
          const std::string text = direction == 1 ? "inside" : direction == 2 ? "outside" : "unclear";
          if (test) {
            id(test_count)++;
            id(last_test_direction).publish_state(text);
            id(test_counter).publish_state(id(test_count));
            id(test_opening).trigger(text);
          } else {
            id(real_count)++;
            id(last_direction).publish_state(text);
            id(real_counter).publish_state(id(real_count));
            id(opening).trigger(text);
          }
          ESP_LOGI("cat_flap", "%sOpening direction: %s", test ? "TEST: " : "", text.c_str());
  # Call from a compatible reader driver once hardware is selected.
  - id: process_chip
    parameters:
      chip: string
      test: bool
    then:
      - lambda: |-
          auto normalize = [](const std::string &value) -> std::string {
            std::string result;
            for (const char c : value) {
              if (c >= '0' && c <= '9') result += c;
              else if (c != ' ' && c != '-') return "";
            }
            return result.size() == 15 ? result : "";
          };
          const std::string number = normalize(chip);
          const std::string known = normalize(id(allowed_chip).state);
          const std::string status = number.empty() ? "invalid chip ID" :
            known.empty() ? "no cat enrolled" :
            number == known ? "own cat" : "unknown chip";
          if (test) id(rfid_test_status).publish_state(status);
          else id(rfid_status).publish_state(status);
          // Do not write chip IDs to the log.
          ESP_LOGI("cat_flap", "%sRFID: %s", test ? "TEST: " : "", status.c_str());

  # Call with calibrated cell voltage once the measurement circuit is connected.
  - id: process_battery
    parameters:
      voltage: float
      test: bool
    then:
      - lambda: |-
          if (!std::isfinite(voltage) || voltage < 2.5f || voltage > 4.3f) {
            if (test) id(battery_test_status).publish_state("invalid reading");
            return;
          }
          // Preliminary thresholds for a 1S lithium cell; no percentage estimate.
          bool &low = test ? id(test_battery_low) : id(real_battery_low);
          const bool previous = low;
          if (voltage <= 3.50f) low = true;
          else if (voltage >= 3.65f) low = false;
          if (test) {
            id(test_battery_reading).publish_state(voltage);
            id(test_battery_warning).publish_state(low);
            id(battery_test_status).publish_state(low ? "Battery low" : "Battery sufficient");
          } else {
            id(real_battery_voltage).publish_state(voltage);
            id(real_battery_warning).publish_state(low);
          }
          // Report state changes only, rather than every measurement.
          if (previous != low) {
            const std::string event_type = low ? "low" : "recovered";
            if (test) id(test_battery_event).trigger(event_type);
            else id(battery_event).trigger(event_type);
          }

interval:
  - interval: 20ms
    then:
      - lambda: |-
          const bool test = id(test_mode).state;
          // Wait for valid, debounced GPIO states after boot.
          if (!test && (!id(inside_contact).has_state() || !id(outside_contact).has_state())) return;
          const bool inside = test ? id(test_inside).state : id(inside_contact).state;
          const bool outside = test ? id(test_outside).state : id(outside_contact).state;
          const uint32_t now = millis();

          // Both signals within 100 ms make the direction ambiguous.
          if (id(pending_direction) != 0) {
            if ((id(pending_direction) == 1 && outside) || (id(pending_direction) == 2 && inside))
              id(pending_direction) = 3;
            if (static_cast<uint32_t>(now - id(signal_since)) >= 100) {
              id(report_movement).execute(id(pending_direction), test);
              id(pending_direction) = 0;
            }
          }

          if (inside || outside) {
            id(quiet_timer_running) = false;
            if (id(ready)) {
              id(ready) = false;
              id(signal_since) = now;
              id(pending_direction) = inside && outside ? 3 : inside ? 1 : 2;
            }
          } else {
            if (!id(quiet_timer_running)) {
              id(quiet_timer_running) = true;
              id(quiet_since) = now;
            }
            // Unsigned subtraction handles millis() rollover.
            if (id(pending_direction) == 0 && static_cast<uint32_t>(now - id(quiet_since)) >= 500)
              id(ready) = true;
          }


text:
  - platform: template
    id: allowed_chip
    name: Allowed chip ID
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ''
    min_length: 0
    max_length: 32
    entity_category: config
  - platform: template
    id: test_chip
    name: Test chip ID
    mode: text
    optimistic: true
    initial_value: ''
    min_length: 0
    max_length: 32

number:
  - platform: template
    id: test_battery_voltage
    name: Test battery voltage
    optimistic: true
    initial_value: 4.0
    min_value: 2.5
    max_value: 4.3
    step: 0.05
    unit_of_measurement: V
    mode: box

button:
  - platform: template
    name: Test read chip
    on_press:
      - if:
          condition:
            switch.is_on: test_mode
          then:
            - script.execute:
                id: process_chip
                chip: !lambda return id(test_chip).state;
                test: true
  - platform: template
    name: Test check battery
    on_press:
      - if:
          condition:
            switch.is_on: test_mode
          then:
            - script.execute:
                id: process_battery
                voltage: !lambda return id(test_battery_voltage).state;
                test: true
